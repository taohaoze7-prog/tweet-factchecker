<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>FactChecker · 真扩展沙盒（mock）</title>
<style>
  /* 模拟 X 暗色信息流，驱动真实 content.js（点「核查」走真实渲染路径） */
  body { margin: 0; background: #000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif; }
  .col { max-width: 600px; margin: 0 auto; padding: 30px 16px 120px; }

  article { border-bottom: 1px solid #16181c; padding: 14px 6px; }
  .ahead { display: flex; gap: 11px; align-items: center; margin-bottom: 8px; }
  .av { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,#3a3f47,#1f2227); }
  .nm { font-weight: 700; }
  .hd { color: #6b7178; }
  [data-testid="tweetText"] { font-size: 15.5px; line-height: 1.5; margin: 4px 0 12px; }
  [role="group"] { display: flex; gap: 56px; color: #6b7178; font-size: 13px; align-items: center; }
</style>
</head>

<div class="col">
